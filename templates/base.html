<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}心电监测系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <div class="logo-dot"></div>
            <span class="brand-name">CardioMatrix</span>
            <span class="brand-sub">心电 + 压力 + 压电监测平台</span>
        </div>
        <nav class="app-nav">
            <a href="{{ url_for('index') }}" class="{% if active == 'index' %}active{% endif %}">主监测</a>
            <a href="{{ url_for('device_page') }}" class="{% if active == 'device' %}active{% endif %}">设备状态</a>
        </nav>
        <div class="status-pill" id="connPill">
            <span class="dot"></span>
            <span class="conn-text">连接中</span>
        </div>
    </header>

    <main class="app-main">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/' + page_js) }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
