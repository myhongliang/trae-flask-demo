{% extends "base.html" %}
{% set active = "device" %}
{% set page_js = "device.js" %}
{% block title %}设备状态 · 心电监测系统{% endblock %}

{% block content %}
<div class="device-grid">
    <!-- 通讯模块卡片 -->
    <section class="panel modules-panel">
        <div class="panel-head"><h2>通讯模块</h2></div>
        <div class="module-cards" id="moduleCards"></div>
    </section>

    <!-- 运行日志 -->
    <section class="panel logs-panel">
        <div class="panel-head">
            <h2>运行日志</h2>
            <div class="head-actions">
                <button class="ghost-btn" id="refreshLogsBtn">刷新</button>
                <button class="ghost-btn" id="clearLogsBtn">清空</button>
            </div>
        </div>
        <div class="logs-list" id="logsList"></div>
    </section>

    <!-- 参数配置 -->
    <section class="panel config-panel">
        <div class="panel-head"><h2>参数配置</h2></div>
        <form class="config-form" id="configForm">
            <div class="form-row">
                <label>通讯方式</label>
                <select name="link">
                    <option value="USB-CDC">USB-CDC (有线)</option>
                    <option value="BLE">BLE (无线)</option>
                </select>
            </div>
            <div class="form-row">
                <label>采样率 (Hz)</label>
                <input type="number" name="sample_rate" min="100" max="2000" step="50" value="500">
            </div>
            <div class="form-row">
                <label>ECG 通道数</label>
                <input type="number" name="ecg_channels" min="1" max="4" value="4" disabled>
            </div>
            <div class="form-row">
                <label>矩阵使能</label>
                <input type="checkbox" name="matrix_enabled" checked>
            </div>
            <div class="form-row">
                <label>压电通道数</label>
                <input type="number" name="piezo_channels" min="1" max="2" value="2" disabled>
            </div>
            <button type="submit" class="primary-btn">下发配置</button>
        </form>
    </section>

    <!-- 固件升级 -->
    <section class="panel upgrade-panel">
        <div class="panel-head"><h2>固件升级</h2></div>
        <form class="config-form" id="upgradeForm">
            <div class="form-row">
                <label>当前版本</label>
                <input type="text" id="curVer" disabled>
            </div>
            <div class="form-row">
                <label>目标版本</label>
                <input type="text" name="version" placeholder="例如 1.0.1">
            </div>
            <div class="form-row">
                <label>固件文件</label>
                <input type="file" accept=".bin,.hex">
            </div>
            <button type="submit" class="primary-btn">开始升级</button>
        </form>
    </section>
</div>
{% endblock %}
